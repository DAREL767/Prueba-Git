<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="styles.css">
    <title>DevStyle | Tienda de Ropa</title>
</head>
<body>
    <header>
        <main>
        <h2>Productos Destacados</h2>
        <section class="catalogo">
            <section class="carrito-container">
            <h2>Tu Carrito 🛒</h2>
            <ul id="lista-carrito">
                <li>El carrito está vacío</li>
            </ul>
            <p><strong>Total: $<span id="total-pago">0</span></strong></p>
        </section>
            <article class="producto">
                <h3>Camiseta "CSS Wizard"</h3>
                <p>Precio: $25.00</p>
                <button onclick="agregarAlCarrito('Camiseta CSS Wizard', 25)">Agregar al Carrito</button>
            </article>

            <article class="producto">
                <h3>Hoodie "Git Push --Force"</h3>
                <p>Precio: $45.00</p>
                <button onclick="agregarAlCarrito('Hoodie Git Push', 45)">Agregar al Carrito</button>
            </article>
        </section>
    </main>
        <h1>DevStyle 👕</h1>
        <p>Ropa geek para desarrolladores</p>
    </header>

</html>
